name: qa_harness_dashboard
description: >-
  Internal QA dashboard for the multi-profile messaging test harness.
  Material 3 + Fluent touches, Hugeicons exclusively, neutral solid palette.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  # Note: uses CardThemeData/DialogThemeData (Flutter >= 3.27 recommended).
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Material 3 (built into Flutter) — no extra package needed.
  # Hugeicons — exclusive icon library for this dashboard.
  hugeicons: ^1.1.7
  # Networking + state.
  http: ^1.2.1
  provider: ^6.1.2
  # CSV/TXT file picking for batch upload.
  file_picker: ^12.1.3
  # Local persistence for API key + server URL.
  shared_preferences: ^2.2.3
  # Intl for timestamps.
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
